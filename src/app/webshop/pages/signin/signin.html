<div class="col-md-6 offset-3 bg-light p-2 rounded shadow mt-5">
  <h2 class="text-center my-3">Sign In</h2>
  <div class="form-floating mb-3">
    <input
      type="email"
      class="form-control"
      name="email"
      id="email"
      placeholder="Email"
    />
    <label for="formId1">Email</label>
  </div>
  <div class="form-floating mb-3">
    <input
      type="password"
      class="form-control"
      name="password"
      id="password"
      placeholder="Email"
    />
    <label for="formId1">Password</label>
  </div>
  <button class="btn btn-success w-100 text-uppercase">Login</button>
</div>
