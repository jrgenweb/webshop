<nav class="navbar navbar-expand-sm navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" href="#">Webshop</a>
    <button
      class="navbar-toggler d-lg-none"
      (click)="collapsed = !collapsed"
      type="button"
      aria-controls="collapsibleNavId"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div
      class="navbar-collapse"
      id="collapsibleNavId"
      [class.collapse]="collapsed"
    >
      <ul class="navbar-nav me-auto mt-2 mt-lg-0">
        <li class="nav-item">
          <a
            class="nav-link"
            href="#"
            routerLink="/webshop"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            >Termékek <span class="visually-hidden">(current)</span></a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            href="#"
            routerLink="/about"
            routerLinkActive="active"
            >Rólunk</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            href="#"
            routerLink="/contact"
            routerLinkActive="active"
            >Kapcsolat</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            href="#"
            routerLink="/cart"
            routerLinkActive="active"
            ><app-cart-badge> </app-cart-badge>
          </a>
        </li>
        @if(!authService.isLoggedIn()){
        <li class="nav-item">
          <a
            class="nav-link"
            href="#"
            routerLink="/signup"
            routerLinkActive="active"
            >Regisztráció</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            href="#"
            routerLink="/signin"
            routerLinkActive="active"
            >Belépés</a
          >
        </li>
        }@else {
        <li class="nav-item">
          <a
            class="nav-link bg-danger text-white"
            href="#"
            routerLink="/dashboard"
            routerLinkActive="active"
            >ADMIN</a
          >
        </li>
        <li class="nav-item dropdown" [class.show]="isDropdownOpen">
          <a
            class="nav-link dropdown-toggle"
            href="#"
            id="dropdownId"
            (click)="toggleDropdown($event)"
            aria-haspopup="true"
            aria-expanded="false"
            >{{ authService.user.name }}</a
          >
          <div
            class="dropdown-menu"
            aria-labelledby="dropdownId"
            [class.show]="isDropdownOpen"
          >
            <a class="dropdown-item" routerLink="/profile">Profilom</a>
            <a class="dropdown-item" routerLink="/orders">Megrendelések</a>
            <a
              class="dropdown-item text-danger"
              href="#"
              (click)="$event.preventDefault(); authService.logout()"
              >Kijelentkezés</a
            >
          </div>
        </li>

        }
      </ul>
      <!--
      <form class="d-flex my-2 my-lg-0">
        <input class="form-control me-sm-2" type="text" placeholder="Search" />
        <button class="btn btn-outline-success my-2 my-sm-0" type="submit">
          Search
        </button>
      </form>
      -->
    </div>
  </div>
</nav>
