<div class="card h-100">
  <div class="ratio ratio-1x1">
    <img
      class="card-img-top object-fit-cover"
      src="{{ product.images[0] }}"
      alt="Title"
      (error)="onImageError($event)"
      [routerLink]="'/webshop/product/' + product.slug"
    />
  </div>
  <div class="card-body d-flex flex-column justify-content-between">
    <h4 class="card-title" [routerLink]="'/webshop/product/' + product.slug">
      {{ product.title }}
    </h4>
    <p class="card-text">{{ product.description | shorten : 100 }}</p>
    <h4 class="text-center">
      {{ product.price | currency : "Ft" : "symbol" : "1.0-0" }}
    </h4>
  </div>
  <div class="card-footer">
    <div class="mb-3 d-flex gap-1">
      <input
        type="number"
        class="form-control"
        name="quantity"
        id="quantity"
        aria-describedby="helpId"
        placeholder=""
        value="1"
        min="1"
        [(ngModel)]="amount"
      />
      <button
        class="btn btn-primary text-nowrap"
        (click)="cartService.add(product, amount)"
      >
        Kosárba
      </button>
    </div>
  </div>
</div>
