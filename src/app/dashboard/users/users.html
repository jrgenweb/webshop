<div class="filter">
  <form
    class="bg-light p-2 rounded-2 shadow row"
    #filterForm="ngForm"
    (reset)="userService.clearFilter()"
  >
    <div class="flex-group">
      <mat-form-field class="full-width">
        <mat-label>Név</mat-label>
        <input
          matInput
          name="filterName"
          [(ngModel)]="filterName"
          (keyup)="userService.name = filterName"
        />
      </mat-form-field>
      <mat-form-field class="full-width">
        <mat-label>Email</mat-label>
        <input
          matInput
          name="filterEmail"
          [(ngModel)]="filterEmail"
          (keyup)="userService.email = filterEmail"
        />
      </mat-form-field>
    </div>
    <div class="flex-group">
      <div>
        <mat-form-field>
          <mat-label>Jogosultság</mat-label>
          <mat-select
            [(ngModel)]="filterRole"
            (selectionChange)="userService.role = filterRole"
            name="role"
          >
            <mat-option selected value="">Összes</mat-option>
            <mat-option value="admin">Admin</mat-option>
            <mat-option value="customer">Customer</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div>
        <button matButton="tonal" type="reset">Törlés</button>
        <button matButton="filled" class="btn btn-success">Szűrés</button>
      </div>
    </div>
  </form>
</div>

<div class="flex-group justify-content-end">
  <button matFab extended (click)="openAddDialog()">
    <mat-icon fontIcon="add"></mat-icon>
    Hozzáadás
  </button>
</div>

@if(dataSource.data.length>0){
<div class="table-responsive">
  <div class="mat-elevation-8">
    <table mat-table [dataSource]="dataSource">
      <!-- Position Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>Azonosító</th>
        <td mat-cell *matCellDef="let element">{{ element.id }}</td>
      </ng-container>

      <!-- Avatar Column-->
      <ng-container matColumnDef="avatar">
        <th mat-header-cell *matHeaderCellDef>Avatar</th>
        <td mat-cell *matCellDef="let element">
          <img
            [src]="element.avatar | fallbackImage"
            [alt]="element.name + '  picture'"
            class="img-thumbnail"
          />
        </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Név</th>
        <td mat-cell *matCellDef="let element">
          {{ element.name }}
        </td>
      </ng-container>

      <!-- Total Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let element">
          {{ element.email }}
        </td>
      </ng-container>

      <!-- Category Column -->
      <ng-container matColumnDef="password">
        <th mat-header-cell *matHeaderCellDef>Jelszó</th>
        <td mat-cell *matCellDef="let element">
          {{ element.password }}
        </td>
      </ng-container>
      <!-- Created Column -->
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Jogosultság</th>
        <td mat-cell *matCellDef="let element">
          {{ element.role }}
        </td>
      </ng-container>

      <!-- Action Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Műveletek</th>
        <td mat-cell *matCellDef="let element">
          <button matIconButton="" (click)="openAddDialog(element)">
            <mat-icon fontIcon="edit"></mat-icon>
          </button>
          <button matIconButton="" (click)="openConfirmDialog(element)">
            <mat-icon fontIcon="delete" color="accent"></mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
      aria-label="Select page of periodic elements"
    >
    </mat-paginator>
  </div>
</div>
}@else {

<h2>Nincsen megjelníthető adat</h2>
}
