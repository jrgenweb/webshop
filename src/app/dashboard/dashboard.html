<!-- Sidebar toggle button mobilon -->

<div class="d-flex gap-2">
  <!-- Sidebar -->
  <nav
    class="collapse d-flex bg-light flex-lg-column p-2 sidebar"
    id="sidebarNav"
  >
    <div class="text-center mb-2">
      <a
        class="navbar-brand text-uppercase font-monospace fs-4 d-none d-sm-none d-md-none d-lg-block"
        routerLink="/"
        >Dashboard</a
      >
    </div>

    <ul class="nav nav-pills flex-lg-column flex-row mb-auto text-nowrap gap-2">
      <li class="nav-item">
        <a
          class="nav-link p-1 p-sm-1 p-md-2"
          routerLink="/dashboard/summary"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="bi bi-bar-chart-fill me-1"></i>
          <span class="d-md-none d-sm-none d-none d-lg-inline"
            >Statisztika</span
          >
        </a>
      </li>
      <li class="nav-item">
        <a
          class="nav-link p-1 p-sm-1 p-md-2"
          routerLink="/dashboard/orders"
          routerLinkActive="active"
          ><i class="bi bi-basket-fill me-1"></i
          ><span class="d-md-none d-sm-none d-none d-lg-inline"
            >Megrendelések</span
          ></a
        >
      </li>
      <li class="nav-item">
        <a
          class="nav-link p-1 p-sm-1 p-md-2"
          routerLink="/dashboard/products"
          routerLinkActive="active"
          ><i class="bi bi-cart-fill me-1"></i
          ><span class="d-md-none d-sm-none d-none d-lg-inline"
            >Termékek</span
          ></a
        >
      </li>
      <li class="nav-item">
        <a
          class="nav-link p-1 p-sm-1 p-md-2"
          routerLink="/dashboard/users"
          routerLinkActive="active"
          ><i class="bi bi-people-fill me-1"></i
          ><span class="d-md-none d-sm-none d-none d-lg-inline"
            >Felhasználók</span
          ></a
        >
      </li>
    </ul>

    <hr />
    <button class="btn btn-success" routerLink="/">WEBSHOP</button>

    <hr />
    <div class="dropdown">
      <a
        href="#"
        class="d-flex align-items-center text-decoration-none dropdown-toggle justify-content-center"
        id="dropdownUser"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        <img
          [src]="authService.user.avatar"
          alt=""
          width="32"
          height="32"
          class="rounded-circle me-2"
        />
        <span class="d-none d-md-block d-lg-block">
          <strong>{{ authService.user.name }}</strong>
        </span>
      </a>
      <ul
        class="dropdown-menu text-small shadow"
        aria-labelledby="dropdownUser"
      >
        <li><a class="dropdown-item" href="#">Settings</a></li>
        <li><a class="dropdown-item" href="#">Sign out</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main content -->
  <main class="flex-fill p-3">
    <router-outlet></router-outlet>
  </main>
</div>
<app-toast></app-toast>
