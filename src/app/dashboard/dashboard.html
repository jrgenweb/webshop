<mat-toolbar color="primary">
  <button mat-icon-button (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>Webshop - Dashboard</span>
</mat-toolbar>
<mat-sidenav-container style="min-height: 100%">
  <mat-sidenav #sidenav opened mode="push" style="width: 250px">
    <div class="logo">
      <h2>Dashboard</h2>
    </div>

    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/dashboard/summary"
        routerLinkActive="active"
        class="mat-list-item"
      >
        <span class="mat-list-item">
          <mat-icon>bar_chart</mat-icon>
          <span>Statisztika</span>
        </span>
      </a>
      <a mat-list-item routerLink="/dashboard/orders" routerLinkActive="active">
        <span class="mat-list-item">
          <mat-icon>shopping_basket</mat-icon>
          <span>Megrendelések</span>
        </span>
      </a>

      <a
        mat-list-item
        routerLink="/dashboard/products"
        routerLinkActive="active"
      >
        <span class="mat-list-item">
          <mat-icon>shopping_cart</mat-icon>
          <span>Termékek</span>
        </span>
      </a>

      <a mat-list-item routerLink="/dashboard/users" routerLinkActive="active">
        <span class="mat-list-item">
          <mat-icon>group</mat-icon>
          <span>Felhasználók</span>
        </span>
      </a>
    </mat-nav-list>

    <mat-divider class="m-2"></mat-divider>

    <div class="m-1 flex-group justify-content-center">
      <button mat-raised-button color="primary" routerLink="/">Webshop</button>
    </div>

    <mat-divider class="m-2"></mat-divider>
    <div class="flex-group justify-content-center">
      <button mat-button [matMenuTriggerFor]="menu">
        <div class="btn-user-profile">
          <mat-icon>expand_more</mat-icon>
          <img
            [src]="authService.user.avatar"
            width="32"
            height="32"
            class="rounded-full me-2"
            style="border-radius: 50%"
          />
          {{ authService.user.name }}
        </div>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item>Beállítások</button>
        <button mat-menu-item>Kijelentkezés</button>
      </mat-menu>
    </div>
  </mat-sidenav>
  <mat-sidenav-content style="padding: 1rem">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>

<app-toast></app-toast>
