<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <div class="dialog-content">
    <span class="item-name">{{ data.itemName }}</span>
    <p>{{ data.message }}</p>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton (click)="close(false)">Mégsem</button>
  <button matButton="filled" color="warn" (click)="close(true)">Igen</button>
</mat-dialog-actions>
