<div
  class="modal fade"
  [class.show]="show"
  id="modalId"
  tabindex="-1"
  role="dialog"
  aria-labelledby="modalTitleId"
  aria-hidden="true"
>
  <div
    class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-md"
    role="document"
  >
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitleId">{{ title }}</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
          (click)="onConfirm(false)"
        ></button>
      </div>
      <div class="modal-body">
        <ng-content></ng-content>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-secondary"
          data-bs-dismiss="modal"
          (click)="onConfirm(false)"
        >
          {{ cancelButton }}
        </button>
        <button type="button" class="btn btn-primary" (click)="onConfirm(true)">
          {{ confirmButton }}
        </button>
      </div>
    </div>
  </div>
</div>
@if(show){
<div class="modal-backdrop fade" [class.show]="show"></div>
}
