<div class="row g-3 mb-4">
  <div
    class="col-md-4"
    *ngFor="
      let card of [
        { title: 'Összes termék', value: summary().totalProducts },
        { title: 'Kategóriák száma', value: summary().totalCategories },
        { title: 'Felhasználók', value: summary().totalUsers }
      ]
    "
  >
    <div class="card shadow-sm text-center">
      <div class="card-body">
        <h6 class="text-secondary">{{ card.title }}</h6>
        <h3 class="fw-bold">{{ card.value }}</h3>
      </div>
    </div>
  </div>
</div>

<!-- Termékszám kategóriánként -->
<div class="card shadow-sm mb-4">
  <div class="card-body">
    <h5 class="card-title mb-3">Termékek kategóriánként</h5>

    <div *ngFor="let cat of productCountByCategory()">
      <div class="d-flex justify-content-between small">
        <span>{{ cat.name }}</span>
        <span>{{ cat.count }}</span>
      </div>
      <div class="progress mb-2" style="height: 6px">
        <div
          class="progress-bar bg-primary"
          role="progressbar"
          [style.width]="
            (cat.count /
              (summary().productCountByCategory | maxValue : 'count')) *
              100 +
            '%'
          "
        ></div>
      </div>
    </div>
  </div>
</div>

<!-- Átlagár kategóriánként -->
<div class="card shadow-sm mb-4">
  <div class="card-body">
    <h5 class="card-title mb-3">Átlagár kategóriánként</h5>

    <div *ngFor="let cat of avgPriceByCategory()">
      <div class="d-flex justify-content-between small">
        <span>{{ cat.name }}</span>
        <span>{{ cat.avg | currency : "HUF" : "symbol" : "1.0" }}</span>
      </div>
      <div class="progress mb-2" style="height: 6px">
        <div
          class="progress-bar bg-success"
          role="progressbar"
          [style.width]="
            (cat.avg / (summary().avgPriceByCategory | maxValue : 'avg')) *
              100 +
            '%'
          "
        ></div>
      </div>
    </div>
  </div>
</div>
