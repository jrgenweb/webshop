<div class="summary">
  <div class="summary-cards">
    @for(card of summaryCardData;track $index){

    <div class="card">
      <mat-card [routerLink]="card.url">
        <mat-card-content>
          <mat-card-title>{{ card.title }} </mat-card-title>
          <mat-card-subtitle>
            <span class="card-value">
              {{ card.value }}
            </span>
          </mat-card-subtitle>
        </mat-card-content>
      </mat-card>
    </div>

    }
  </div>

  <mat-divider></mat-divider>
  <div class="charts-container">
    <div class="chart">
      <mat-card>
        <mat-card-content>
          <mat-card-title> Termékek száma kategóriánként </mat-card-title>
          <canvas
            baseChart
            [data]="productCountChartData"
            [labels]="productCountChartData.labels"
            [options]="productCountChartOptions"
          >
          </canvas>
        </mat-card-content>
      </mat-card>
    </div>

    <div class="chart">
      <mat-card>
        <mat-card-content>
          <mat-card-title>Átlagár kategóriánként</mat-card-title>
          <canvas
            baseChart
            [data]="avgPriceChartData"
            [labels]="avgPriceChartData.labels"
            [options]="avgPriceChartOptions"
          >
          </canvas>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
  <mat-divider></mat-divider>
  <!-- Legújabb termékek -->
  <div class="newest-products" style="">
    <app-card-stepper title="Legújabb termékek">
      @for(p of newestProducts();track p.id){
      <div class="card" #slide class="slide">
        <mat-card>
          <img [src]="p.images[0] | fallbackImage" mat-card-image />
          <mat-card-content>
            <mat-card-title>{{ p.title | shorten : 24 }}</mat-card-title>
            <p>
              {{ p.description | shorten : 50 }}
            </p>
          </mat-card-content>
          <mat-card-actions class="flex-group justify-content-end">
            <button matButton>Megtekintés</button>
          </mat-card-actions>
        </mat-card>
      </div>

      }
    </app-card-stepper>
  </div>
</div>
